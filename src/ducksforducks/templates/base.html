<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Ducks for Ducks{% endblock %}</title>
    <link
      href="{{ url_for('static', filename='dist/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
        <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='d4d.jpg') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}"
          >Ducks for Ducks</a
        >
      </div>
    </nav>
    <div class="container mt-4">{% block content %}{% endblock %}</div>
    <footer class="footer mt-4 py-3 bg-dark text-light">
      <div class="container">
        <span class="text-muted"
          >Ducks for Ducks is brought to you by
          <a href="https://git.private.coffee/PrivateCoffee/ducksforducks"
            >Private.coffee</a
          >
        </span>
      </div>
    </footer>
  </body>
</html>
